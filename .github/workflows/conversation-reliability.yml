name: Conversation reliability

on:
  pull_request:
  push:
    branches:
      - main
      - preview/hero-matte-black
      - fix/universal-conversation-reliability
      - release/v1.2-candidate-2026-10-14

jobs:
  conversation-reliability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:conversation-reliability
      - run: npm run test:owner-pricing-regression
      - run: npm run test:demo-chat
      - run: npm run test:handoff-timing
      - run: npm run test:inbound-voice
      - run: npm run test:owner-profile-update
      - run: npm run test:client-account-regression
      - run: npm run test:profile-access
      - run: npm run test:voice-demo
      - run: npm run test:paddle-sandbox-webhook
      - run: npm run test:v1-stabilization
      - run: npm run test:raja-closure
      - run: npm run test:raja-handoff-data
      - run: npm run build
